<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
</head>
<body>

  <div class="error-wrapper">
    <div class="error-container">

      <!-- LEFT IMAGE -->
      <div class="left-section">
        <img src="error-page-not-found-vector.png" alt="Error Illustration">
      </div>

      <!-- RIGHT CONTENT -->
      <div class="right-section">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you are looking for might have been removed, 
           had its name changed, or is temporarily unavailable.</p>
        <a routerLink="/homepage" class="home-button">Go to Home</a>
      </div>

    </div>
  </div>

</body>
</html>
